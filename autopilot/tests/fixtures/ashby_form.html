<!doctype html><html><body>
<form>
 <div class="field"><label for="_systemfield_name">Name *</label><input id="_systemfield_name" required></div>
 <div class="field"><label for="_systemfield_email">Email *</label><input id="_systemfield_email" type="email" required></div>
 <div class="field"><label for="_systemfield_resume">Resume *</label><input id="_systemfield_resume" type="file" required></div>
 <div class="field"><label>Do you require visa sponsorship to work in India? *</label>
   <div class="yesno"><button type="button" onclick="this.parentElement.dataset.v='Yes'">Yes</button><button type="button" onclick="this.parentElement.dataset.v='No'">No</button></div></div>
 <div class="field"><label for="ck">I acknowledge the privacy notice *</label><input id="ck" type="checkbox" required></div>
 <button type="submit">Submit Application</button>
</form>
<script src="_success.js"></script>
</body></html>
