# Job autopilot: daily discover -> score -> tailor -> auto-apply (Greenhouse/Lever/Ashby).
# Setup + secrets: autopilot/README.md.
#
# Personal data never touches tracked files here:
#   * profile.yaml arrives via the AUTOPILOT_PROFILE_B64 secret
#   * run state is force-pushed as a single commit to the orphan `autopilot-state` branch
#   * tailored PDFs + form screenshots are a 14-day workflow artifact
# and the job refuses to run at all unless the repository is PRIVATE.

name: Job autopilot

on:
  schedule:
    - cron: "47 12 * * *"        # daily 08:47 New York (EDT) / 07:47 (EST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fill forms but never click Submit"
        type: boolean
        default: true

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write                # push the autopilot-state branch only

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Refuse to run in a public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "$private" != "true" ]; then
            echo "::error::Autopilot handles your personal data and only runs in a PRIVATE repository. See autopilot/README.md."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autopilot/requirements.txt

      - name: Install
        run: |
          pip install -r autopilot/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore state
        run: |
          mkdir -p autopilot/state
          if git fetch --depth 1 origin autopilot-state 2>/dev/null; then
            git show FETCH_HEAD:state.json > autopilot/state/state.json
            echo "restored $(wc -c < autopilot/state/state.json) bytes of state"
          else
            echo "no state branch yet - first run"
          fi

      - name: Run autopilot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTOPILOT_PROFILE_B64: ${{ secrets.AUTOPILOT_PROFILE_B64 }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: python -m autopilot.run $DRY_FLAG

      - name: Save state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f autopilot/state/state.json ] || exit 0
          dir="$RUNNER_TEMP/state"; mkdir -p "$dir"; cp autopilot/state/state.json "$dir/"
          cd "$dir"
          git init -q -b autopilot-state
          git add state.json
          git -c user.name="autopilot" -c user.email="autopilot@users.noreply.github.com" commit -qm "autopilot state $(date -u +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" autopilot-state

      - name: Upload tailored documents + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-${{ github.run_id }}
          path: autopilot/out/
          retention-days: 14
          if-no-files-found: ignore

